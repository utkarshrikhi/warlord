# reelbot settings. Anything left out falls back to the defaults in reelbot/config.py.
# Secrets (API keys, Instagram token) go in .env, not here.

claude:
  model: claude-opus-5-5
  effort: medium        # low | medium | high
  scenes: 5             # 4-7 keeps reels around 20-40 seconds
  language: English

video:
  style: illustrated    # illustrated (AI image per scene) | cartoon (code-drawn, free, offline)
  motion: true          # slow pan/zoom on each still
  width: 1080
  height: 1920
  fps: 30
  subtitles: true
  outro_text: Follow for more stories!
  outro_voice: Follow for more stories!

images:
  provider: gemini      # gemini | openai | placeholder (free offline preview, no API calls)
  gemini_model: gemini-nano-banana-2.1
  openai_model: gpt-image-2
  # The look of every scene. Tweak freely; it is sent with every image request.
  style: >-
    Clean 2D digital cartoon illustration like popular animated storytime channels.
    Characters are simple stick figures with large round white heads, thin black line
    arms and legs, small dot eyes and small expressive mouths; some wear simple clothes
    (t-shirt, skirt, cap) and have simple cartoon hair. Backgrounds are detailed and
    realistic-looking everyday places drawn with clean dark outlines, flat soft shading,
    accurate perspective, soft natural light and a muted, slightly desaturated color palette.

# Recurring main character. Its reference image is drawn once (`reelbot mascot`)
# and passed to every scene so the character looks the same in every video.
# You can replace assets/mascot.png with your own drawing.
mascot:
  name: Max
  description: >-
    a stick-figure guy with a big round white head, a red baseball cap, messy brown hair
    sticking out under the cap, small black dot eyes, thin black line body, arms and legs,
    and white sneakers
  reference: assets/mascot.png

tts:
  provider: edge        # edge (free, natural voices) | gtts | none
  voice: en-US-AndrewNeural   # list voices: edge-tts --list-voices
  rate: "+0%"

music:
  dir: assets/music
  volume: 0.12

instagram:
  api_version: v23.0
  upload_mode: resumable   # resumable = upload from disk; url = host first (see hosting)
  always_hashtags: [reelbot, animatedstory]
  max_hashtags: 15

hosting:                   # only used when upload_mode is url
  provider: s3             # s3 | cloudinary
  s3_bucket: ""
  s3_region: ""

schedule:
  timezone: UTC            # your IANA timezone, e.g. America/New_York
  times: ["09:30", "19:00"]
  topics: []               # empty = rotate through all topics in topics.yaml
  auto_post: true
