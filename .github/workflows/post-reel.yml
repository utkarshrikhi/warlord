name: Post reel

# Scheduled runs only happen once you set the repository variable
# REELBOT_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
# Required secrets: ANTHROPIC_API_KEY, GEMINI_API_KEY (or OPENAI_API_KEY), IG_USER_ID, IG_ACCESS_TOKEN.
# Commit assets/mascot.png so every run uses the same mascot.

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC daily; add more lines for more posts per day
    - cron: "30 13 * * *"  # 13:30 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic key from topics.yaml (blank = next in rotation)"
        required: false
      prompt:
        description: "Or your own plot idea"
        required: false
      dry_run:
        description: "Generate only, don't post"
        type: boolean
        default: false

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  reel:
    if: github.event_name == 'workflow_dispatch' || vars.REELBOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install reelbot
        run: pip install ".[openai]"

      # history.json drives topic rotation and avoids repeating stories
      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: output/history.json
          key: reelbot-history-${{ github.run_id }}
          restore-keys: reelbot-history-

      - name: Generate and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          PROMPT: ${{ inputs.prompt }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$PROMPT" ]; then
            args=(generate --prompt "$PROMPT")
          elif [ -n "$TOPIC" ]; then
            args=(generate --topic "$TOPIC")
          else
            args=(auto)
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          fi
          if [ "${args[0]}" = "generate" ] && [ "$DRY_RUN" != "true" ]; then
            args+=(--post)
          fi
          reelbot "${args[@]}"

      - name: Save history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/history.json
          key: reelbot-history-${{ github.run_id }}

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/caption.txt
            output/*/story.json
            output/*/scene_*.png
          retention-days: 14
